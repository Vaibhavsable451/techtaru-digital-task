<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Extraction Bot</title>
<style>
  :root{--bg:#0f1115;--card:#181b22;--line:#2a2e38;--text:#e7e9ee;--mute:#8b91a1;--accent:#7c9cff;--bad:#ff6b6b;--warn:#ffb454}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--text)}
  main{max-width:1000px;margin:0 auto;padding:32px 20px}
  h1{margin:0 0 4px;font-size:24px} p.sub{margin:0 0 24px;color:var(--mute)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  textarea{width:100%;height:340px;background:#0f1115;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;font:13px/1.5 ui-monospace,monospace;resize:vertical}
  pre{margin:0;height:340px;overflow:auto;font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap}
  .row{display:flex;gap:8px;margin-top:12px;align-items:center}
  select,button{background:#0f1115;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font:inherit}
  button.primary{background:var(--accent);color:#0b1020;border:0;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:wait}
  .err{color:var(--bad)} .warn{color:var(--warn)} h3{margin:0 0 8px;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>
<main>
  <h1>Data Extraction Bot</h1>
  <p class="sub">Paste a resume or invoice. Get clean, validated JSON.</p>
  <div class="grid">
    <section class="card">
      <h3>Unstructured text</h3>
      <textarea id="text" placeholder="Paste text here..."></textarea>
      <div class="row">
        <select id="type"><option value="resume">Resume</option><option value="invoice">Invoice</option></select>
        <button class="primary" id="go">Extract</button>
        <button id="sample">Load sample</button>
      </div>
    </section>
    <section class="card">
      <h3>Structured JSON</h3>
      <pre id="out">Result appears here.</pre>
      <div id="warn" class="warn"></div>
    </section>
  </div>
</main>
<script>
const SAMPLES = {
  resume: "Priya Sharma\npriya.sharma@example.com | +91 98765 43210 | Pune, India\nPython developer with 3 years building APIs.\nSkills: Python, FastAPI, SQL, Docker\nExperience:\nBackend Developer, Infosys (Jun 2022 - Present) - built REST services.\nEducation: B.E. Computer Engineering, Savitribai Phule Pune University, 2022",
  invoice: "INVOICE #INV-2026-044\nVendor: Sai Traders\nBill to: Acme Pvt Ltd\nDate: 2026-10-01  Due: 2026-10-15\n2 x Laptop stand @ 1500 = 3000\n1 x USB hub @ 800 = 800\nSubtotal: INR 3800\nGST 18%: 684\nTotal: INR 4484"
};
const $ = id => document.getElementById(id);
$("sample").onclick = () => $("text").value = SAMPLES[$("type").value];
$("go").onclick = async () => {
  const btn = $("go"); btn.disabled = true; $("warn").textContent = "";
  $("out").className = ""; $("out").textContent = "Extracting...";
  try {
    const r = await fetch("/extract", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({text: $("text").value, doc_type: $("type").value})});
    const j = await r.json();
    if (!r.ok) { $("out").className = "err";
      $("out").textContent = j.error || JSON.stringify(j.detail || j, null, 2); return; }
    $("out").textContent = JSON.stringify(j.data, null, 2);
    $("warn").textContent = j.warnings.join(" ");
  } catch (e) { $("out").className = "err"; $("out").textContent = "Network error: " + e.message; }
  finally { btn.disabled = false; }
};
</script>
</body>
</html>
